name: Sync Planar Status HUD

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Status HUD SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/sync_status.py

      - name: Commit updated HUD if changed
        run: |
          if git diff --quiet assets/status-dark.svg assets/status-light.svg; then
            echo "Status HUD unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status-dark.svg assets/status-light.svg
          git commit -m "chore: sync planar status HUD contributions"
          git push
